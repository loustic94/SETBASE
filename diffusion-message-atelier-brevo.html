<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SET — Diffuser un message à mon atelier</title>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<style>
  :root {
    --accent: #2f6b4f;
    --accent-light: #e8f2ec;
    --text: #1f2b24;
    --muted: #667066;
    --border: #d9e1dc;
    --bg: #fafbf9;
    --error: #b3432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
  .atelier-banner {
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 18px;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* --- Habillage de l'éditeur Quill pour coller au style existant --- */
  #editor-wrapper {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .ql-toolbar.ql-snow {
    border: none;
    border-bottom: 1px solid var(--border);
    background: var(--accent-light);
  }
  .ql-container.ql-snow { border: none; font-family: inherit; font-size: 0.95rem; }
 #editor-wrapper {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  resize: vertical;      /* la poignée apparaît ici, sur le bloc entier */
  height: 220px;          /* hauteur de départ, modifiable en glissant */
  min-height: 160px;
}
.ql-toolbar.ql-snow {
  border: none;
  border-bottom: 1px solid var(--border);
  background: var(--accent-light);
  flex: 0 0 auto;         /* la barre d'outils garde sa taille */
}
.ql-container.ql-snow {
  border: none;
  font-family: inherit;
  font-size: 0.95rem;
  flex: 1 1 auto;         /* l'éditeur prend tout l'espace restant */
  overflow-y: auto;
}

  button {
    margin-top: 24px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .message {
    margin-top: 16px;
    font-size: 0.9rem;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .message.ok { background: var(--accent-light); color: var(--accent); }
  .message.err { background: #fbeceA; color: var(--error); }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Diffuser un message à mon atelier</h1>
  <p class="subtitle">Le message sera envoyé par e-mail à tous les membres inscrits à l'atelier. Toute réponse vous reviendra directement.</p>

  <div id="atelier-banner" class="atelier-banner">Chargement de l'atelier…</div>

  <form id="form" class="hidden">
    <label for="nom">Votre nom</label>
    <input type="text" id="nom" required>
    <label for="objet">Objet du message</label>
    <input type="text" id="objet" required maxlength="150">

    <label for="editor">Message à diffuser</label>
    <div id="editor-wrapper">
      <div id="editor"></div>
    </div>

   <button type="submit" id="submit-btn">Envoyer le message</button>
  </form>

  <div id="result"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
  // ---- CONFIG (même pattern que les autres pages du portail) ----
  const CONFIG = {
    BASEROW_TOKEN: 'd3iEChkWA7yj7mlkA9EkGWjSWTzUtG2E',
    API_URL: 'https://api.baserow.io/api/database/rows/table/',
    TABLE_DEMANDES_ENVOI: 1160720,
    TABLE_ATELIERS: 1010821,
    STATUT_INITIAL: 'En attente', // doit correspondre exactement à l'option du champ Statut
    STATUT_ENVOI: 'A envoyer',      // exactement l'option du champ Statut
   
    RETOUR_BASE: 'https://set-animateurs.baserow.site/ateliers/',
    RETOUR_URL: 'https://set-animateurs.baserow.site/',   // repli si aucune adresse
  };

  const params = new URLSearchParams(window.location.search);
  const atelierId = params.get('atelier_id');
  const nomPrerempli = params.get('nom');

  const bannerEl = document.getElementById('atelier-banner');
  const formEl = document.getElementById('form');
  const resultEl = document.getElementById('result');
  const submitBtn = document.getElementById('submit-btn');
  let emailParam = (params.get('email') || '').replace(/ /g, '+').trim();
  if (!emailParam.includes('@')) emailParam = '';   // valeur inexploitable : on ignore

  // ---- Initialisation de l'éditeur riche ----
  // Barre d'outils volontairement réduite : gras/italique/souligné, listes, lien.
  // On garde ça simple, comme une mise en forme Excel basique plutôt que
  // toutes les options d'un traitement de texte complet.
  const quill = new Quill('#editor', {
    theme: 'snow',
    placeholder: 'Écrivez votre message ici…',
    modules: {
      toolbar: [
        ['bold', 'italic', 'underline'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link'],
        ['clean']
      ]
    }
  });

  function headers() {
    return {
      'Authorization': `Token ${CONFIG.BASEROW_TOKEN}`,
      'Content-Type': 'application/json'
    };
  }
function htmlPourEmail(html) {
  return html
    .replace(/<span class="ql-ui"[^>]*><\/span>/g, '')
    .replace(/([a-zA-Z-]+)="([^"]*)"/g, "$1='$2'")  // guillemets d'attributs -> apostrophes
    .replace(/"/g, '&quot;')                          // guillemets restants (dans le texte)
    .replace(/\\/g, '&#92;')
    .replace(/[\r\n]+/g, '');
}
const pause = (ms) => new Promise(r => setTimeout(r, ms));

async function attendreResultat(rowId) {
  for (let i = 0; i < 15; i++) {                       // 15 x 2 s = 30 s maximum
    await pause(2000);
    const res = await fetch(`${CONFIG.API_URL}${CONFIG.TABLE_DEMANDES_ENVOI}/${rowId}/?user_field_names=true`, { headers: headers() });
    if (!res.ok) continue;
    const row = await res.json();
    const statut = row['Statut'] && row['Statut'].value;
    if (statut === 'Envoyé') return { ok: true };
    if (statut === 'En attente' && row['Erreur']) return { ok: false, erreur: row['Erreur'] };
  }
  return { ok: null };
}
  async function init() {
    if (!atelierId) {
      bannerEl.textContent = "Lien invalide : identifiant d'atelier manquant. Contactez l'administrateur du portail.";
      bannerEl.style.color = 'var(--error)';
      bannerEl.style.background = '#fbeceA';
      return;
    }
    retourUrl = construireRetour(emailParam || premierEmail(atelier['Email_Animateur']));
    try {
      const res = await fetch(`${CONFIG.API_URL}${CONFIG.TABLE_ATELIERS}/${atelierId}/?user_field_names=true`, {
        headers: headers()
      });
      if (!res.ok) throw new Error('Atelier introuvable (' + res.status + ')');
      const atelier = await res.json();

      bannerEl.textContent = `Atelier : ${atelier['Nom_Atelier']}`;
      if (nomPrerempli) document.getElementById('nom').value = nomPrerempli;
      formEl.classList.remove('hidden');
    } catch (err) {
      bannerEl.textContent = "Impossible de charger l'atelier : " + err.message;
      bannerEl.style.color = 'var(--error)';
      bannerEl.style.background = '#fbeceA';
    }
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Quill laisse un "<p><br></p>" quand c'est vide : on vérifie le texte
    // brut (getText), pas le HTML, pour valider que le champ n'est pas vide.
    // C'est l'équivalent de tester TRIM(A1)<>"" plutôt que A1<>"" dans Excel.
    const texteBrut = quill.getText().trim();
    if (!texteBrut) {
      resultEl.innerHTML = '<div class="message err">Le message ne peut pas être vide.</div>';
      return;
    }



const objet = document.getElementById('objet').value.trim();
if (!confirm("Envoyer ce message à tous les membres inscrits à l'atelier ? Cette action est définitive.")) return;

submitBtn.disabled = true;
submitBtn.textContent = 'Envoi en cours…';
resultEl.innerHTML = '';
const payload = {
  'Nom': document.getElementById('nom').value,
  'Objet': objet,
  'Corps_html': htmlPourEmail(quill.getSemanticHTML()),
  'Corps du mail (texte)': texteBrut,
  'Atelier': [parseInt(atelierId, 10)],
  'Statut': CONFIG.STATUT_INITIAL
};

try {
  submitBtn.disabled = true; submitBtn.textContent = 'Envoi en cours…';
  const res = await fetch(`${CONFIG.API_URL}${CONFIG.TABLE_DEMANDES_ENVOI}/?user_field_names=true`,
    { method: 'POST', headers: headers(), body: JSON.stringify(payload) });
  if (!res.ok) throw new Error(await res.text());
  const row = await res.json();

  // 2e appel : la MODIFICATION du statut déclenche le workflow d'envoi
  const res2 = await fetch(`${CONFIG.API_URL}${CONFIG.TABLE_DEMANDES_ENVOI}/${row.id}/?user_field_names=true`,
    { method: 'PATCH', headers: headers(), body: JSON.stringify({ 'Statut': CONFIG.STATUT_ENVOI }) });
  if (!res2.ok) throw new Error(await res2.text());

  formEl.classList.add('hidden');
  resultEl.innerHTML = '<div class="message ok">Message enregistré, envoi en cours…</div>';
  const r = await attendreResultat(row.id);
  const lien = `<p><a href="${retourUrl}">Retour à l'application</a></p>`;

  if (r.ok === false) {
    resultEl.innerHTML = `<div class="message err">L'envoi a échoué : ${r.erreur}</div>${lien}`;
  } else {
    resultEl.innerHTML = `<div class="message ok">${r.ok ? 'Message envoyé à vos membres.' : "Message enregistré, l'envoi suit son cours."}</div>${lien}`;
    setTimeout(() => { window.location.href = retourUrl; }, 2500);
  }
} catch (err) {
  resultEl.innerHTML = '<div class="message err">Erreur lors de l\'envoi : ' + err.message + '</div>';
  submitBtn.disabled = false; submitBtn.textContent = 'Envoyer le message';
}
  });
const emailParam = (params.get('email') || '').replace(/ /g, '+').trim();  // un "+" arrive comme une espace
let retourUrl = CONFIG.RETOUR_URL;

function premierEmail(v) {                      // gère texte simple ou liste
  if (Array.isArray(v)) v = v.map(x => (x && x.value) ? x.value : x).join(',');
  return String(v || '').split(/[,;\s]+/).find(s => s.includes('@')) || '';
}
function construireRetour(email) {
  return email ? CONFIG.RETOUR_BASE + encodeURIComponent(email) : CONFIG.RETOUR_URL;
}
  init();
</script>

</body>
</html>
