<html lang="fr">

    :root {

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

<script>
/* ── État global (inchangé) ──────────────────── */
let membreActuel   = null;
let seancesChargees = [];
let inscriptionsExistantes = new Set();
let ateliersInscrits = new Set();

/* ══════════════════════════════════════════════════════════════
   🔧 HELPER API — DIFFÉRENCE #2 vs Airtable
   ──────────────────────────────────────────────────────────────
   • Endpoint de base différent (database/rows/table/{id}/)
   • En-tête d'autorisation : "Token xxx" (Baserow) au lieu de
     "Bearer xxx" (Airtable) — un peu comme deux banques qui vous
     demandent chacune un format de RIB différent pour le même virement.
   • Le paramètre ?user_field_names=true est CRUCIAL : sans lui,
     Baserow retourne les champs sous forme "field_123" (ID interne)
     au lieu du nom lisible "Nom_Atelier". C'est l'équivalent de
     demander à Excel d'afficher les en-têtes de colonnes en toutes
     lettres plutôt qu'en références A1/B2.
   • Réponse : { count, next, previous, results: [...] } au lieu de
     { records: [...], offset }. La pagination se fait par numéro de
     page, pas par jeton "offset".
   ══════════════════════════════════════════════════════════════ */
const API = 'https://api.baserow.io/api';

async function baserowFetch(tableId, queryString = '', options = {}) {
  const sep = queryString.startsWith('?') ? '&' : (queryString ? '&' : '');
  const url = `${API}/database/rows/table/${tableId}/?user_field_names=true${queryString ? sep + queryString.replace(/^\?/, '') : ''}`;
  const res = await fetch(url, {
    ...options,
    headers: {
      'Authorization': `Token ${CONFIG.TOKEN}`,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const detail = err.error || err.detail || JSON.stringify(err);
    throw new Error(`[${res.status}] ${detail}`);
  }
  return res.json();
}

/* Récupère TOUTES les pages d'une requête (équivalent de la boucle
   "do { ... offset = data.offset } while(offset)" côté Airtable) */
async function baserowFetchAll(tableId, queryString = '') {
  let results = [];
  let page = 1;
  while (true) {
    const pageParam = `page=${page}&size=200${queryString ? '&' + queryString.replace(/^\?/, '') : ''}`;
    const data = await baserowFetch(tableId, pageParam);
    results = results.concat(data.results || []);
    if (!data.next) break;
    page++;
  }
  return results;
}

/* ══════════════════════════════════════════════════════════════
   🔧 HELPER — champs "liaison" et "choix" Baserow
   ──────────────────────────────────────────────────────────────
   Sur Airtable, un champ liaison renvoie ["recXXX", "recYYY"] et un
   champ liste déroulante renvoie juste "Validé" (texte simple).
   Sur Baserow, comme on l'a vu en testant votre table ATELIERS :
     • champ liaison  → [{id: 3, value: "..."}, {id: 7, value: "..."}]
     • champ liste déroulante → {id: 6413739, value: "Validé", color: "..."}
   Analogie Excel : c'est comme si une cellule qui contenait juste le
   texte "Validé" devenait soudain une mini-table à 3 colonnes
   (ID, texte, couleur) — il faut aller chercher .value au lieu de
   lire la cellule directement.
   Ces deux fonctions centralisent cette extraction pour ne pas la
   répéter partout dans le code.
   ══════════════════════════════════════════════════════════════ */
function idsDeLiaison(champ) {
  // champ = [{id,value}, ...] → [id, id, ...]
  return Array.isArray(champ) ? champ.map(x => x.id) : [];
}
function valeurChoix(champ) {
  // champ = {id, value, color} ou null → "value" ou ""
  if (!champ) return '';
  return typeof champ === 'object' ? (champ.value || '') : String(champ);
}
function valeurLookup(champ) {
  // Un champ "Lookup" Baserow renvoie en général un tableau de valeurs
  // brutes. On le rend robuste à plusieurs formats possibles.
  if (Array.isArray(champ)) {
    const premier = champ[0];
    if (premier == null) return '';
    return typeof premier === 'object' ? (premier.value || '') : String(premier);
  }
  return champ ? String(champ) : '';
}

/* ── Utilitaires (inchangés) ─────────────────── */
function afficherStatus(id, type, html) {
  const el = document.getElementById(id);
  el.className = type;
  el.innerHTML = html;
  el.style.display = 'block';
}
function cacherStatus(id) {
  document.getElementById(id).style.display = 'none';
}
function formaterDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function formaterHeure(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
}

/* ── ÉTAPE 1 : Recherche membre par email ────── */
async function chercherMembre() {
  const email = document.getElementById('f-email').value.trim();
  const btn   = document.getElementById('btn-chercher');

  cacherStatus('status-msg');

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    afficherStatus('status-msg', 'error', '⚠️ Veuillez saisir une adresse email valide.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Recherche…`;

  try {
    /* ══════════════════════════════════════════════════════════
       🔧 DIFFÉRENCE #3 : filtrage
       ──────────────────────────────────────────────────────────
       Airtable : filterByFormula=  avec une syntaxe de formule
                  ({Email}="...")
       Baserow  : filter__NomDuChamp__equal=valeur  — un paramètre
                  d'URL par condition. Plus proche d'un filtre de
                  tableau croisé dynamique que d'une formule Excel.
       ══════════════════════════════════════════════════════════ */
    const url = `filter__Email__equal=${encodeURIComponent(email)}`;
    const data = await baserowFetch(CONFIG.TABLE_MEMBRES, url);

    if (!data.results || data.results.length === 0) {
      afficherStatus('status-msg', 'error',
        `❌ Aucun membre trouvé pour <strong>${email}</strong>.<br>
         <small>Vérifiez l'adresse ou inscrivez-vous d'abord via le formulaire d'adhésion.</small>`);
      btn.disabled = false;
      btn.innerHTML = `Rechercher <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`;
      return;
    }

    const r = data.results[0];
    // DIFFÉRENCE #4 : plus de r.fields['...'] imbriqué — avec
    // user_field_names=true, les champs sont directement à la racine
    // de l'objet, comme dans Airtable, mais r.id est ici un ENTIER,
    // pas une chaîne "recXXXX".
    membreActuel = {
      id:     r.id,
      nom:    r['Nom']    || '',
      prenom: r['Prénom'] || '',
      email:  r['Email']  || email,
    };

    const initiales = (membreActuel.prenom[0] || '') + (membreActuel.nom[0] || '');
    document.getElementById('membre-avatar').textContent       = initiales.toUpperCase();
    document.getElementById('membre-nom').textContent          = `${membreActuel.prenom} ${membreActuel.nom}`;
    document.getElementById('membre-email-display').textContent = membreActuel.email;

    await chargerAteliersInscrits();
    await chargerInscriptionsExistantes();
    await chargerSeances();

    document.getElementById('etape-1').classList.remove('active');
    document.getElementById('etape-2').classList.add('active');

  } catch(e) {
    afficherStatus('status-msg', 'error', `❌ Erreur : ${e.message}`);
  }

  btn.disabled = false;
  btn.innerHTML = `Rechercher <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`;
}

/* ── Chargement des ateliers actifs du membre ─── */
async function chargerAteliersInscrits() {
  ateliersInscrits.clear();
  try {
    /* ══════════════════════════════════════════════════════════
       🔧 DIFFÉRENCE #5 : filtrer sur un champ liaison
       ──────────────────────────────────────────────────────────
       Baserow propose un filtre dédié pour "ce champ liaison
       contient telle ligne" : link_row_has=ID
       C'est plus direct que la formule Airtable
       FIND("recXXX", ARRAYJOIN({Membre})).
       ══════════════════════════════════════════════════════════ */
    const url = `filter__Membre__link_row_has=${membreActuel.id}`;
    const rows = await baserowFetchAll(CONFIG.TABLE_INSCRIPTIONS, url);

    const statutsValides = ['Actif', 'Actif+'];

    rows.forEach(r => {
      const statut = valeurChoix(r['Statut']); // champ liste déroulante → objet {value}
      if (statutsValides.includes(statut.trim())) {
        const ateliers = idsDeLiaison(r['Atelier']); // champ liaison → tableau d'objets {id}
        ateliers.forEach(aid => ateliersInscrits.add(aid));
      }
    });

    console.log(`✅ ${ateliersInscrits.size} atelier(s) actif(s) pour ce membre:`, [...ateliersInscrits]);
  } catch(e) {
    console.warn('Ateliers inscrits non chargés:', e.message);
  }
}

/* ── Chargement des inscriptions existantes ──── */
async function chargerInscriptionsExistantes() {
  inscriptionsExistantes.clear();
  try {
    const url = `filter__MEMBRES__link_row_has=${membreActuel.id}`;
    const rows = await baserowFetchAll(CONFIG.TABLE_INSCRIPTIONS_SEANCES, url);
    rows.forEach(r => {
      const seances = idsDeLiaison(r['SEANCES']);
      seances.forEach(sid => inscriptionsExistantes.add(sid));
    });
  } catch(e) {
    console.warn('Inscriptions existantes non chargées:', e.message);
  }
}

/* ── Chargement des séances futures ──────────── */
async function chargerSeances() {
  document.getElementById('seances-list').innerHTML =
    '<div class="loading-seances"><span class="spinner spinner-dark"></span> Chargement des séances…</div>';
  document.getElementById('filtre-ateliers').innerHTML = '';

  try {
    const aujourd_hui = new Date().toISOString();

    /* ══════════════════════════════════════════════════════════
       🔧 DIFFÉRENCE #6 : filtre de date
       ──────────────────────────────────────────────────────────
       Airtable : IS_AFTER({Date_Heure}, "...") dans une formule
       Baserow  : filter__Date_Heure__date_after=ISO_DATE

       ⚠️ Le filtre Statut = "Programmée" OU vide est plus délicat à
       exprimer en un seul paramètre d'URL Baserow (il faudrait un
       filtre combiné OR, plus complexe à construire). Pour rester
       simple et fiable, on filtre uniquement sur la date côté
       serveur, puis on refait le tri Statut ci-dessous en
       JavaScript — exactement la même logique que votre AND(...OR...)
       d'origine, juste déplacée côté navigateur.
       ══════════════════════════════════════════════════════════ */
    const url = `filter__Date_Heure__date_after=${encodeURIComponent(aujourd_hui)}`;
    const toutesSeancesBrutes = await baserowFetchAll(CONFIG.TABLE_SEANCES, url);

    const toutesSeances = toutesSeancesBrutes.filter(r => {
      const statut = valeurChoix(r['Statut']);
      return statut === 'Programmée' || statut === '';
    });

    // Tri par date croissante (le tri Airtable sort[0] n'a pas
    // d'équivalent direct simple ici pour un champ lié — on trie
    // donc côté client, ce qui est tout aussi fiable)
    toutesSeances.sort((a, b) => new Date(a['Date_Heure']) - new Date(b['Date_Heure']));

    if (ateliersInscrits.size > 0) {
      seancesChargees = toutesSeances.filter(s => {
        const ateliersSeance = idsDeLiaison(s['Atelier']);
        return ateliersSeance.some(aid => ateliersInscrits.has(aid));
      });
      console.log(`Séances filtrées : ${seancesChargees.length} / ${toutesSeances.length} (ateliers du membre)`);
    } else {
      seancesChargees = [];
      console.warn('Aucun atelier inscrit trouvé pour ce membre');
    }

    afficherSeances(seancesChargees);
    construireFiltres(seancesChargees);

  } catch(e) {
    document.getElementById('seances-list').innerHTML =
      `<div class="loading-seances" style="color:var(--error)">⚠️ Impossible de charger les séances : ${e.message}</div>`;
  }
}

/* ── Affichage des séances ───────────────────── */
let filtreActif = 'Tous';

function afficherSeances(seances) {
  const liste = document.getElementById('seances-list');

  // CORRIGÉ : dans votre table SEANCES Baserow, le champ s'appelle
  // "Atelier" (pas "Nom_Atelier") et c'est un champ LIAISON direct
  // (pas un Lookup) → structure [{id, value}, ...]. On réutilise
  // idsDeLiaison-like logique mais pour le texte : premier élément .value
  const getAtelier = s => (Array.isArray(s['Atelier']) && s['Atelier'][0]) ? s['Atelier'][0].value : '';

  const filtrees = filtreActif === 'Tous'
    ? seances
    : seances.filter(s => getAtelier(s) === filtreActif);

  if (seancesChargees.length === 0 && ateliersInscrits.size === 0) {
    liste.innerHTML = `<div class="aucune-seance">
      ⚠️ Vous n'êtes inscrit(e) à aucun atelier actif.<br>
      <small>Inscrivez-vous d'abord à un atelier via le formulaire d'adhésion.</small>
    </div>`;
    return;
  }
  if (filtrees.length === 0) {
    liste.innerHTML = '<div class="aucune-seance">Aucune séance à venir pour cet atelier.</div>';
    return;
  }

  liste.innerHTML = `<div class="seances-grid">${filtrees.map(s => {
    const atelierVal     = (Array.isArray(s['Atelier']) && s['Atelier'][0]) ? s['Atelier'][0].value : '';
    // ⚠️ EN ATTENTE DE CONFIRMATION : ces champs n'existent pas tels
    // quels dans votre table SEANCES Baserow actuelle (contrairement
    // à Airtable où c'étaient des champs formule/lookup). Le "complet"
    // est donc désactivé pour l'instant (toujours false) — dites-moi
    // où se trouve cette info dans Baserow et je réactive la logique.
    const placesLimitees = false;
    const placesMax      = 0;
    const complet         = false;
    const dejaInscrit     = inscriptionsExistantes.has(s.id);
    const titre     = atelierVal || 'Séance';
    const date      = s['Date_Heure'] ? formaterDate(s['Date_Heure']) : '—';
    const heure     = s['Date_Heure'] ? formaterHeure(s['Date_Heure']) : '';
    const lieu      = s['Lieu'] || '';
    const duree     = s['Durée_Minutes'] ? `${s['Durée_Minutes']} min` : '';

    let infosPlaces = '';
    if (placesLimitees) {
      infosPlaces = complet
        ? `<span style="color:var(--error)">🔴 Complet</span>`
        : placesMax > 0
          ? `<span style="color:var(--accent)">🟢 Places disponibles (max ${placesMax})</span>`
          : `<span style="color:var(--accent)">🟢 Places disponibles</span>`;
    }

    let classeExtra = '';
    let badge = '';
    if (dejaInscrit) { classeExtra = 'deja-inscrit'; badge = '<span class="badge-inscrit">✓ Déjà inscrit</span>'; }
    else if (complet) { classeExtra = 'complet'; badge = '<span class="badge-complet">Complet</span>'; }

    const disabled = complet || dejaInscrit;

    return `<label class="seance-item ${classeExtra}" id="lbl-${s.id}">
      <input type="checkbox" value="${s.id}"
        ${disabled ? 'disabled' : ''}
        onchange="toggleSeance('${s.id}', this)" />
      <div class="seance-content">
        <div class="seance-titre">${titre}</div>
        <div class="seance-meta">
          <span>📅 ${date}</span>
          ${heure ? `<span>🕐 ${heure}</span>` : ''}
          ${lieu  ? `<span>📍 ${lieu}</span>`  : ''}
          ${duree ? `<span>⏱ ${duree}</span>`  : ''}
          ${infosPlaces ? `<span>${infosPlaces}</span>` : ''}
        </div>
      </div>
      ${badge}
    </label>`;
  }).join('')}</div>`;
}

function toggleSeance(id, cb) {
  document.getElementById('lbl-' + id).classList.toggle('selected', cb.checked);
}

/* ── Filtres par atelier (inchangé, utilise getAtelier) ──────── */
function construireFiltres(seances) {
  const getAtel = s => (Array.isArray(s['Atelier']) && s['Atelier'][0]) ? s['Atelier'][0].value : '';
  const ateliers = [...new Set(seances.map(getAtel).filter(Boolean))].sort();
  const wrap = document.getElementById('filtre-ateliers');

  if (ateliers.length <= 1) return;

  wrap.innerHTML = [
    `<button class="filtre-btn actif" data-atelier="Tous">Tous</button>`,
    ...ateliers.map(a => `<button class="filtre-btn" data-atelier="${a.replace(/"/g,'&quot;')}">${a}</button>`)
  ].join('');

  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.filtre-btn');
    if (!btn) return;
    filtreActif = btn.dataset.atelier;
    document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('actif'));
    btn.classList.add('actif');
    afficherSeances(seancesChargees);
  });
}

/* ── Retour étape 1 (inchangé) ────────────────── */
function retourEtape1() {
  membreActuel = null;
  seancesChargees = [];
  inscriptionsExistantes.clear();
  ateliersInscrits.clear();
  filtreActif = 'Tous';
  cacherStatus('status-msg-2');
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('etape-2').classList.remove('active');
  document.getElementById('etape-1').classList.add('active');
}

/* ── Soumission inscriptions ─────────────────── */
async function soumettreInscriptions() {
  const btn = document.getElementById('btn-inscrire');
  const progressWrap = document.getElementById('progress-wrap');
  const progressBar  = document.getElementById('progress-bar');

  cacherStatus('status-msg-2');

  const seancesChoisies = [...document.querySelectorAll('#seances-list input[type="checkbox"]:checked')]
    .map(cb => cb.value);

  if (seancesChoisies.length === 0) {
    document.getElementById('status-msg-2').style.cssText = 'display:block;padding:1rem 1.2rem;border-radius:10px;font-size:.93rem;margin-top:.5rem;background:#fdecea;border:1px solid #f5b7b1;color:var(--error)';
    document.getElementById('status-msg-2').innerHTML = '⚠️ Veuillez sélectionner au moins une séance.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Inscription en cours…`;
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';

  const aujourd_hui = new Date().toISOString().split('T')[0];
  const total = seancesChoisies.length;

  try {
    const erreurs = [];

    for (let i = 0; i < total; i++) {
      const seanceIdStr = seancesChoisies[i];
      const seanceId     = parseInt(seanceIdStr, 10); // IDs Baserow = entiers
      const seance   = seancesChargees.find(s => s.id === seanceId);
      const atelierVal  = (Array.isArray(seance?.['Atelier']) && seance['Atelier'][0]) ? seance['Atelier'][0].value : '';
      const titreSeance = atelierVal || 'Séance';

      // ⚠️ Vérification "complet" désactivée en attendant de savoir
      // où se trouve cette info dans votre table Baserow (voir note
      // plus haut dans afficherSeances).

      const msgEl = document.getElementById('status-msg-2');
      msgEl.style.cssText = 'display:block;padding:1rem 1.2rem;border-radius:10px;font-size:.93rem;margin-top:.5rem;background:#eef4fb;border:1px solid #b3d0ee;color:#1a5276';
      msgEl.innerHTML = `⏳ Inscription ${i + 1}/${total} — ${titreSeance}…`;

      /* ══════════════════════════════════════════════════════════
         🔧 DIFFÉRENCE #9 : création d'une ligne (POST)
         ──────────────────────────────────────────────────────────
         Airtable : { fields: { 'MEMBRES': [id], ... } }
         Baserow  : { 'MEMBRES': [id], ... }  → PAS de wrapper "fields"
                    (grâce à user_field_names=true). Les IDs dans les
                    champs liaison doivent être des ENTIERS, pas des
                    chaînes "recXXX".
         ══════════════════════════════════════════════════════════ */
      await baserowFetch(
        CONFIG.TABLE_INSCRIPTIONS_SEANCES,
        '',
        {
          method: 'POST',
          body: JSON.stringify({
            'MEMBRES':          [membreActuel.id],
            'SEANCES':          [seanceId],
            'Date_Inscription': aujourd_hui,
            'Statut':           'Inscrit',
            'Adresse_Mail':     membreActuel.email,
          })
        }
      );

      progressBar.style.width = Math.round(100 * (i + 1) / total) + '%';
    }

    const nbInscrits = total - erreurs.length;
    const msgEl = document.getElementById('status-msg-2');
    let msgHtml = '';
    if (nbInscrits > 0) {
      msgHtml += `✅ <strong>${membreActuel.prenom} ${membreActuel.nom}</strong> inscrit(e) à <strong>${nbInscrits} séance${nbInscrits > 1 ? 's' : ''}</strong> avec succès !`;
    }
    if (erreurs.length > 0) {
      msgHtml += `${nbInscrits > 0 ? '<br><br>' : ''}⚠️ ${erreurs.length} séance${erreurs.length > 1 ? 's' : ''} non inscrite${erreurs.length > 1 ? 's' : ''} :<br>` + erreurs.join('<br>');
      msgEl.style.cssText = nbInscrits > 0
        ? 'display:block;padding:1rem 1.2rem;border-radius:10px;font-size:.93rem;margin-top:.5rem;background:#fef9e7;border:1px solid #f9e79f;color:#7d6608'
        : 'display:block;padding:1rem 1.2rem;border-radius:10px;font-size:.93rem;margin-top:.5rem;background:#fdecea;border:1px solid #f5b7b1;color:var(--error)';
    } else {
      msgEl.style.cssText = 'display:block;padding:1rem 1.2rem;border-radius:10px;font-size:.93rem;margin-top:.5rem;background:#e8f5ec;border:1px solid #a8d5b5;color:var(--accent)';
    }
    msgEl.innerHTML = msgHtml;

    await chargerInscriptionsExistantes();
    afficherSeances(seancesChargees);

  } catch(e) {
    const msgEl = document.getElementById('status-msg-2');
    msgEl.style.cssText = 'display:block;padding:1rem 1.2rem;border-radius:10px;font-size:.93rem;margin-top:.5rem;background:#fdecea;border:1px solid #f5b7b1;color:var(--error)';
    msgEl.innerHTML = `❌ Erreur : ${e.message}`;
    progressWrap.style.display = 'none';
  }

  btn.disabled = false;
  btn.innerHTML = `Confirmer les inscriptions <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
}

document.getElementById('f-email').addEventListener('keydown', e => {
  if (e.key === 'Enter') chercherMembre();
});
</script>
